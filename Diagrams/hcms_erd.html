<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>HCMS – Entity Relationship Diagram</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#f0f2f5;padding:28px 20px}
.page-title{text-align:center;font-size:20px;font-weight:600;color:#1a1a2e;margin-bottom:4px}
.page-sub{text-align:center;font-size:12px;color:#666;margin-bottom:24px}
.diagram-wrap{background:#fff;border-radius:12px;box-shadow:0 2px 16px rgba(0,0,0,.1);overflow-x:auto;padding:24px}
svg{display:block;width:100%;min-width:960px}

/* entity header */
.eh{font-size:12px;font-weight:700;fill:#fff;text-anchor:middle;dominant-baseline:central}
/* entity field */
.ef{font-size:11px;fill:#1a1a2e;dominant-baseline:central}
.ek{font-size:10px;fill:#7c3aed;dominant-baseline:central;font-weight:700}
/* connector label */
.cl{font-size:10px;fill:#555;text-anchor:middle}
/* relation line */
.rel{fill:none;stroke:#888;stroke-width:1.2}
</style>
</head>
<body>
<p class="page-title">HCMS – entity relationship diagram</p>
<p class="page-sub">Core data entities and relationships · e-health.albania</p>
